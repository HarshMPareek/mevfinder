# DEX registry for ethereum. Scope decided by DefiLlama 24h volume share (2026-09-05) + on-chain presence.
# Every entry starts unverified; `mevlab verify-registry --chain ethereum` checks bytecode + probe and writes
# ethereum_dex.verified.json. status: in_scope | todo (needs addresses/decoder) | unsupported (decoder missing).

[[dex]]
name = "uniswap_v4"
kind = "clmm_v4_singleton"
status = "in_scope"
volume_share_24h = 0.30
pool_manager = "0x000000000004444c5dc75cB358380D2e3dE08A90"
position_manager = "0xbd216513d74c8cf14cf4747e6aaa6420ff64ee9e"  # Uniswap V4 PositionManager: poolKeys(bytes25) for pools whose Initialize log is pruned
