# Ethereum mainnet. Builder-ordered blocks; bundles pay the builder by coinbase transfer inside the tx
# (measured from the call trace) or by a separate tip transaction (not attributed here: known gap).
[chain]
name = "ethereum"
chain_id = 1
family = "ethereum"          # base fee burned; priority fee + coinbase transfers go to the builder/proposer
block_time_ms = 12000
native_symbol = "ETH"
weth = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"

[ordering]
policy = "builder"           # the builder orders the block: top_of_block = first user tx whatever it paid
flashblocks_per_block = 0
trigger_window_blocks = 0    # public mempool: the trigger is in the same block (bundle) or unobservable

[system]
tx_types = []

[explorer]
name = "Etherscan"
tx = "https://etherscan.io/tx/"
address = "https://etherscan.io/address/"
block = "https://etherscan.io/block/"
blockscout = "https://eth.blockscout.com"          # explorer-pull: API v2, plain HTTPS
blockscout_access = "direct"

[endpoints]
http = "ETH_HTTP_URL"
archive = "ETH_ARCHIVE_URL"
trace = "ETH_TRACE_URL"

[pricing]
native_symbol = "ETHUSDT"

[tokens]
WETH   = { address = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", decimals = 18, price = "native" }
USDC   = { address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", decimals = 6,  price = "usd" }
USDT   = { address = "0xdAC17F958D2ee523a2206206994597C13D831ec7", decimals = 6,  price = "usd" }
DAI    = { address = "0x6B175474E89094C44Da98b954EedeAC495271d0F", decimals = 18, price = "usd" }
# dollar stablecoins seen in sandwich / JIT nets (2026-11-01): priced at $1 instead of through a bundle's own legs
USDS   = { address = "0xdC035D45d973E3EC169d2276DDab16f1e407384F", decimals = 18, price = "usd" }
PYUSD  = { address = "0x6c3ea9036406852006290770bedfcaba0e23a0e8", decimals = 6,  price = "usd" }
USDe   = { address = "0x4c9EDD5852cd905f086C759E8383e09bff1E68B3", decimals = 18, price = "usd" }
