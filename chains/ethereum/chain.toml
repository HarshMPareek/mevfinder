"0xef435b99c2108d0309211d0cc05b70d202c0b5df" = { name = "Native NativeRFQPool V6 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0xc419e67388df0c0cfad15584fc5fc7e67a234c17" = { name = "Native NativeRFQPool V4 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x5d1a34369686ae59ac97ae4e1df5635ffda9ee7c" = { name = "Native NativeRFQPool V3 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x37305b1cd40574e4c5ce33f8e8306be057fd7341" = { name = "Maker LitePSM (DAI/USDC)", members = ["0xf6e72db5454dd049d0788e411b06cfaf16853042"] }

# Live follower settings.
# log_range: newest blocks searched for an unknown singleton pool; seed_chunk: eth_getLogs span for the pool seed;
# confirmations: blocks behind the head before a block is classified; trace_window: blocks back the node still traces.
[live]
log_range = 5000
seed_chunk = 10000
confirmations = 2
trace_window = 9000

# Who receives each fee component (measured 2026-11-01 on blocks 26316665-6 from our node: the fee recipient's balance
# rose by priority fees + coinbase transfers; base fee burned; 6 of 10 blocks end with the builder paying the proposer
# (MEV-Boost; Glamsterdam/ePBS not on mainnet: ethereum.org "Testing on devnets, expected Q4 2026").
[fee_flow]
producer_label = "Paid to block builders"
producer_hint = "priority fees and direct tips to the block's builder, who pays the proposer"
priority_step = "Priority fee to the builder"
tip_step = "Tip to the builder"
network_label = "Base fee (burned)"
network_hint = "base fee, burned by the protocol"
chain_fee_step = "Base fee (burned)"
