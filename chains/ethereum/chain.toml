# Lido stETH: 1:1 claim on ETH through Lido's withdrawal queue, trades within ~0.1-0.5 % of ETH; valued at the ETH price
# (no Binance spot pair). It is the collateral of 106 of the first 131 unpriced Aave liquidations (2026-11-01).
stETH  = { address = "0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84", decimals = 18, price = "native" }

# Order-flow kickback recipients (Blink Labs): a structural marker of a private-flow backrun; counted as a cost.
[known_recipients]
# 2026-10-09 random-block hand review: the vanity-address Adapter executes users' gasless orders (permit + transferFrom,
# a relayer EOA sends the transaction, the executor 0x16f19efd routes and keeps a fee); the fee residue had closed as
# cycles on Arbitrum (513092576 #2, 513218684 #3) and Ethereum. An order execution is a settlement, never a cycle.
"0x0000000000bbf5c5fd284e657f01bd000933c96d" = { name = "gasless-swap Adapter (relayer executes a user's permit order through GenericSwapExecutor 0x16f19efd, fee kept)", kind = "settlement" }
# 2026-10-09 random-block hand review: a factory deploys a pre-funded CREATE2 deposit contract and sweeps it — the USDT
# is swapped to USDC, burned through CCTP (0x28b5a0e9 TokenMessengerV2) for another chain and a fee goes to 0xed2e19fa;
# the USDT→USDC→(bridge) sweep had closed as a 0.356 USDT "cycle" (26153457 #241). A deposit sweep is a settlement.
"0x5d1d6fa733bfba0ec7b143de0d7e8a4afa9f9ba9" = { name = "deposit-address sweep factory (CREATE2 deposit contracts swept: swap, CCTP burn, fee to 0xed2e19fa)", kind = "settlement" }
"0x9008d19f58aabd9ed0d60971565aa8510560ab41" = { name = "CoW Protocol GPv2Settlement", kind = "settlement" }
# 2026-10-09 random-block hand review (seed 20261011): a Glide deposit fill — the solver calls the GlideDepositFactory,
# takes the user's 58.75 USDT from the per-user GlideDeposit 0x7e8498d8, swaps it on Uniswap V4 and hands 58.705 USDC
# to the user's recipient; the whole output had been read as a $58.7 cycle (26150219 #112). Same factory as Arbitrum.
"0x442be06bb5d13711a22ccd3fa382b72a874c5135" = { name = "GlideDepositFactory (per-user GlideDeposit orders filled by solvers)", kind = "settlement" }
"0x1111113ccf1426a8e30e2bff5e005d929bf6a90a" = { name = "1inch Fusion settlement (intent fills: few resolvers, many users)", kind = "settlement" }
"0x743be0db30148336a3db479f19d4e1828b293869" = { name = "Blink order-flow kickback", kind = "kickback" }

# RFQ settlement contracts (declared quote venues): a maker's inventory moved by allowance inside their frame is
# that contract's leg (docs/METHOD.md §2). Declared 2026-10-08 from the day sample: each settled quotes for >= 9
# distinct takers against 1-5 maker wallets. Intent / limit-order fills (UniswapX reactors, 1inch OrderFilled,
# CoW) are excluded by their fill events; the stablecoin redemption module 0x54f5eb3e… (one liquidity wallet,
# many users, no round trip) is deliberately not declared.
[quote_venues]
"0x5979458912f80b96d30d4220af8e2e4925a33320" = { name = "RFQ pool (event 0x1eeaa4ac)", event = "0x1eeaa4ac" }
"0xb09aaa8933626d7e4c48d65dad2d77021cfbca9a" = { name = "RFQ pool (event 0x1eeaa4ac)", event = "0x1eeaa4ac" }
"0xbbbbbbb520d69a9775e85b458c58c648259fad5f" = { name = "Bebop settlement", event = "0xadd7095b" }
# 2026-10-09: Bebop's second settlement contract moves the tokens (makers fill inside its frame, it keeps a fee);
# undeclared it was absorbed into the operator group and its 4.53 USDT fee became the "result" (Ethereum 26154677 #2)
"0xbeb0009aca35087ce7ccf11637e24dd1aad3bf2a" = { name = "Bebop settlement (JAM)", event = "0x58073e86" }
"0x054f0377e07d2f460151f935dffc4d880017e63a" = { name = "RFQ settlement (event 0xa441699e)", event = "0xa441699e" }

# Venues the receipts cannot reveal as such: the Maker LitePSM takes DAI into one contract and pays USDC from another
# ("pocket"), so neither address both receives and sends and the pair was read as a payout plus unsourced income
# (2026-10-09 hand review: a +3.78 USDC five-venue cycle counted as a 1,825 USDC loss). Declared venues are infrastructure
# for the trace verdict: never absorbed into the operator's group.
[declared_venues]
