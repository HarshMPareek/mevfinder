# DEX registry for arbitrum. Scope decided by DefiLlama 24h volume share (2026-09-05) + on-chain presence.
# Every entry starts unverified; `mevlab verify-registry --chain arbitrum` checks bytecode + probe and writes
# arbitrum_dex.verified.json. status: in_scope | todo (needs addresses/decoder) | unsupported (decoder missing).

[[dex]]
name = "uniswap_v3"
kind = "clmm_v3"
status = "in_scope"
