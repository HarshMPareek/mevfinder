# the Swap events come from the CL pool manager. Declared as the manager's member so the trace reads the same venue the
# events do (2026-10-31: 81 of 93 "trace-only venue" flags on BSC hand labels were this Vault).
[declared_venues]
"0xba8db0caf781cac69b6acf6c848ac148264cc05d" = { name = "Native CreditVault (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x8ac1009d5f13660ce7089901e51459142ad50793" = { name = "Native NativeRFQPool V6 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x9197a811b152298eae17166b2d33b8a80ba6b980" = { name = "Native NativeRFQPool V4 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x9af2f3c0cd35283e13f7087e2b34b1444b57a44c" = { name = "Native NativeRFQPool V3 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0xa0ffb9c1ce1fe56963b0321b32e7a0302114058b" = { name = "PancakeSwap Infinity CL pool manager", members = ["0x238a358808379702088667322f80ac48bad5e6c4"] }

# Live follower settings.
# log_range: newest blocks searched for an unknown singleton pool; seed_chunk: eth_getLogs span for the pool seed;
# confirmations: blocks behind the head before a block is classified; trace_window: blocks back the node still traces.
[live]
log_range = 5000
seed_chunk = 5000
confirmations = 2
trace_window = 100

# Who receives each fee component (measured 2026-11-01 on blocks 130962167-8 from our node): base fee is 0, so the
# whole gas fee is the validator's; the block's system deposit splits it 10 % burn (0x…dead, BEP-95), ~6.25 %
# SystemReward (0x…1002), the rest ValidatorSet (0x…1000), to the wei. Builders (48 Club, BlockRazor, …) are paid by
# separate native transfers ([known_recipients] kind builder).
[fee_flow]
producer_label = "Paid to validators and builders"
producer_hint = "gas to the validator (10 % of it burned) and tips to builders"
priority_step = "Gas to the validator"
tip_step = "Tip to the builder"
network_label = "Network fees"
network_hint = "none on BSC: the base fee is 0"
chain_fee_step = "Base fee"
