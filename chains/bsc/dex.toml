# DEX registry for BNB Smart Chain. Every entry starts unverified; `./arb -c bsc verify-registry` checks bytecode and
# the probe call on chain and writes dex.verified.json. status: in_scope | todo (needs addresses/decoder).
# Scope: PancakeSwap (V2, V3, Infinity) carries most BSC volume; Uniswap V2/V3/V4, BiSwap, ApeSwap, MDEX, DODO are the
# other venues seen in the 2026-10-07 keyless census (experiments/exp27 in the research repo).

[[dex]]
name = "pancakeswap_v2"
kind = "cpmm_v2"
status = "in_scope"
factory = "0xcA143Ce32Fe78f1f7019d7d551a6402fC5350c73"
router = "0x10ED43C718714eb63d5aA57B78B54704E256024E"
swap_event = "Swap(address,uint256,uint256,uint256,uint256,address)"
probe = { fn = "allPairsLength()", expect = "nonzero" }

[[dex]]
name = "pancakeswap_v3"
kind = "clmm_v3"
status = "in_scope"
factory = "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
router = "0x13f4EA83D0bd40E75C8222255bc855a974568Dd4"
swap_event = "Swap(address,address,int256,int256,uint160,uint128,int24,uint128,uint128)"
probe = { fn = "feeAmountTickSpacing(uint24)", arg = 500, expect = "uint:10" }

[[dex]]
name = "pancakeswap_infinity_cl"
kind = "clmm_v4_singleton"
status = "in_scope"
pool_manager = "0xa0FfB9c1CE1Fe56963B0321B32E7A0302114058b"
vault = "0x238a358808379702088667322f80aC48bAd5e6c4"
swap_event = "Swap(bytes32,address,int128,int128,uint160,uint128,int24,uint24,uint16)"
init_event = "Initialize(bytes32,address,address,address,uint24,bytes32,uint160,int24)"
notes = "PancakeSwap Infinity (V4-style singleton with a separate Vault). Event layouts are Uniswap V4's plus protocolFee / parameters; decoder verified against live logs in the BSC validation pass. Bin pools (0xC697d2…) are undecoded."

