# DEX registry for optimism. Scope decided by DefiLlama 24h volume share (2026-09-05) + on-chain presence.
# Every entry starts unverified; `mevlab verify-registry --chain optimism` checks bytecode + probe and writes
# optimism_dex.verified.json. status: in_scope | todo (needs addresses/decoder) | unsupported (decoder missing).

