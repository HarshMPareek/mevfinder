# Robinhood Chain (Arbitrum Orbit / Nitro). FCFS sequencer, 100 ms blocks, no priority fee honoured:
# reactive backruns land in the same block or 1-3 blocks later, so triggers are searched across blocks.
[chain]
name = "robinhood"
chain_id = 4663
family = "arbitrum"          # receipts carry gasUsedForL1 / l1BlockNumber; L1 cost folded into gasUsed
block_time_ms = 100
native_symbol = "ETH"
weth = "0x0bd7d308f8e1639fab988df18a8011f41eacad73"

[ordering]
policy = "fcfs"
flashblocks_per_block = 0
trigger_window_blocks = 50   # 5 s of chain; beyond that a "trigger" is just the last trade (exp08 anatomy)

[system]
tx_types = [100, 106]        # ArbitrumDepositTx (0x64), ArbitrumInternalTx (0x6a, one per block)

[explorer]
name = "Etherscan (Robinhood)"
tx = "https://robin.etherscan.io/tx/"
address = "https://robin.etherscan.io/address/"
block = "https://robin.etherscan.io/block/"
blockscout = "https://robinhoodchain.blockscout.com"   # explorer-pull: API v2 from a same-origin headless tab (Cloudflare challenge to curl since 2026-10-09)
alt_tx = "https://robinhoodchain.blockscout.com/tx/"
# robinscan.io (the earlier entry) does not resolve (NXDOMAIN, checked 2026-10-31); robin.etherscan.io is Etherscan's Robinhood Chain explorer.

[endpoints]
http = "RH_HTTP_URL"
archive = "RH_ARCHIVE_URL"
trace = "RH_TRACE_URL"

[pricing]
native_symbol = "ETHUSDT"

[tokens]
WETH = { address = "0x0bd7d308f8e1639fab988df18a8011f41eacad73", decimals = 18, price = "native" }
USDG = { address = "0x5fc5360d0400a0fd4f2af552add042d716f1d168", decimals = 6,  price = "usd" }

# Order-flow kickback recipients (Blink Labs): a structural marker of a private-flow backrun; counted as a cost.
[known_recipients]
# 2026-10-09 random-block hand review: the vanity-address Adapter executes users' gasless orders (permit + transferFrom,
# a relayer EOA sends the transaction, the executor 0x16f19efd routes and keeps a fee); the fee residue had closed as
# cycles on Arbitrum (513092576 #2, 513218684 #3) and Ethereum. An order execution is a settlement, never a cycle.
"0x0000000000bbf5c5fd284e657f01bd000933c96d" = { name = "gasless-swap Adapter (relayer executes a user's permit order through GenericSwapExecutor 0x16f19efd, fee kept)", kind = "settlement" }
"0x9008d19f58aabd9ed0d60971565aa8510560ab41" = { name = "CoW Protocol GPv2Settlement", kind = "settlement" }
"0x743be0db30148336a3db479f19d4e1828b293869" = { name = "Blink order-flow kickback", kind = "kickback" }

# RFQ settlement contracts (declared quote venues). A market maker's inventory moved by allowance inside one of
# these contracts' frames is read as that contract's leg, so a pool-versus-quote take counts as a cycle
# (docs/METHOD.md §2). Identified 2026-10-08 structurally: each contract settled quotes for >= 3 distinct takers
# against one maker wallet (Robinhood 0x2f4579ca…, 0x907d1d17…); intent fills (UniswapX, 1inch, CoW) are
# excluded by their fill events instead. Undeclared settlements keep their makers as `uncalled_counterparties`.
[quote_venues]
# Bebop's settlement is deployed at this address on every chain (2026-10-09 late: Base 52340002 #58)
"0xbbbbbbb520d69a9775e85b458c58c648259fad5f" = { name = "Bebop settlement", event = "0xadd7095b" }
