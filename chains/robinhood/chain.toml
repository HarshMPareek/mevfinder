# Live follower settings.
# log_range: newest blocks searched for an unknown singleton pool; seed_chunk: eth_getLogs span for the pool seed;
# confirmations: blocks behind the head before a block is classified; trace_window: blocks back the node still traces.
[live]
log_range = 1000000
seed_chunk = 1000000
confirmations = 1
trace_window = 100

# PancakeSwap Infinity CL keeps pool tokens in its Vault (0xfe7e25de…); declared as the manager's member (as on BSC, Base).
[declared_venues]
"0x57b8f68ef57af2db70bc9aac891836661ca4cb51" = { name = "Native CreditVault (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x45f4d4aed68a04e9a48eed69e1c8b15d7875d25f" = { name = "Native NativeRFQPool V6 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x8428e1ee461cf1ca5fc5873e47a56a656e7b717d" = { name = "Native NativeRFQPool V4 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0x55b503d1a03fc73a875765827ffc28cc15e15f06" = { name = "Native NativeRFQPool V3 (RFQ market maker; docs.native.org addresses, 2026-10-31)" }
"0xd01c774d4a66408326bc65728ac5ae5aaf004032" = { name = "PancakeSwap Infinity CL pool manager", members = ["0xfe7e25de55e5cbbecccb661f3679f873f72b9b0d"] }

# Who receives each fee component (measured 2026-11-01 on blocks 103008996-7 from our node, to the wei): no priority
# fee is collected (effective gas price = base fee on every transaction); gas goes to the infra fee account
# 0x5a2b80a9… and the network fee account 0xbc5c3a7a…. Ordering: first-come, first-served at the sequencer
# (docs.robinhood.com "Differences from Ethereum"; PGA only under evaluation per CoinDesk 2026-10-09).
[fee_flow]
producer_label = "Priority fees"
producer_hint = "none collected: first-come, first-served ordering"
priority_step = "Priority fee"
tip_step = "Direct payment to the sequencer"
network_label = "Network fees"
network_hint = "gas at the base fee (L1 share included), to the chain's fee accounts"
chain_fee_step = "Gas at the base fee (to the chain)"
