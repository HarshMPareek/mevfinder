# exp22 (2026-09-15): hooks identified from bytecode selectors resolved through the public signature database and from
# their revert strings (experiments/exp22_discovery_engine/results/hook_families.md). `gate` is documentation for the
# planner: which swap directions a direct PoolManager caller may not take. Consumers ignore unknown keys.
[[hook]]
address = "0x3ad9e44cb65e518e452bfcb78952ca45b66a8a80"
name = "launch hook of the 0x053e pair: SellNotAllowed(address) unless the swap sender is an authorized router [chain: call trace + selectors]"
