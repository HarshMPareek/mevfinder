# Robinhood Chain V4 hooks and what they take from a swap (exp16 part 3). Every number is [chain] unless marked.
# in_bps: the share of the INPUT the hook removes before the pool swaps (the pool receives amountIn × (1 − in_bps/10000));
#         measured by the calldata differential of 2026-09-09 hour 01 (`experiments/exp15_live_loop/scripts/router_diff.py`: the pool got x × ratio).
# out: "event" = a per-pool cut on the output fitted from the hook's fee events by the exporter (Pons HookFeeCollected,
#      LaunchHook Trade); "none" = no output cut seen.
# dynamic: the cut varies with state or gas (never exact; such pools are priced but not sent through).
[[hook]]
address = "0xe5e702641ea86f4ae6cc3cdaed2b886f976be044"
name = "PonsV2MemeHook (fee/tax hook: setHookFeeBps, pendingCreatorTax, buyback vault; no sender gate) [chain: bytecode selectors, exp22]"
in_bps = 0
out = "event"
dynamic = false
