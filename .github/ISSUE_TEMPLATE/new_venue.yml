name: Missing venue or token
description: A DEX, pool family or token the classifier does not know yet
labels: [registry]
body:
  - type: dropdown
    id: chain
    attributes:
      label: Chain
      options: [Ethereum, Base, BNB Smart Chain, Arbitrum One, OP Mainnet, Robinhood Chain]
    validations:
      required: true
  - type: input
    id: contract
    attributes:
      label: Factory, pool manager or token address
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Swap event signature and an example transaction
