[project]
name = "mevfinder"
version = "0.5.0"
description = "Every arbitrage on six chains, classified from raw receipts and call traces: the code behind mevfinder.com"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["mev", "arbitrage", "ethereum", "base", "bsc", "arbitrum", "optimism", "blockchain-analytics"]
dependencies = [
  "httpx[http2]>=0.27", "eth-abi>=5", "eth-utils>=5",
  "eth-hash[pycryptodome]>=0.7", "hexbytes>=1", "pydantic>=2",
  "python-dotenv>=1", "rich>=13",
]

[project.urls]
Homepage = "https://mevfinder.com"
Repository = "https://github.com/HarshMPareek/mevfinder"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
arb = "arbkit.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbkit", "mevlab"]

[tool.hatch.build.targets.wheel.force-include]
"chains" = "arbkit/chains"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
